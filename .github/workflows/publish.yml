name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to build and upload assets for
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-tauri:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: build Tauri bundles
        uses: tauri-apps/tauri-action@v1.0.0
        with:
          args: ${{ matrix.args }}

      - name: package Windows assets
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $setup = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No NSIS installer found' }
          Copy-Item -LiteralPath $setup.FullName -Destination "RWR-Vehicle-Studio-$version-x64-setup.exe"
          Copy-Item -LiteralPath 'src-tauri/target/release/rwr-vehicle-studio.exe' -Destination "RWR-Vehicle-Studio-$version-portable.exe"

      - name: package macOS assets
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          APP_PATH="$(find src-tauri/target -path '*/release/bundle/macos/*.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "RWR-Vehicle-Studio-${VERSION}-macos-universal.app.zip"
          bun tauri bundle --target universal-apple-darwin --bundles dmg
          DMG_PATH="$(find src-tauri/target -path '*/release/bundle/dmg/*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          cp "$DMG_PATH" "RWR-Vehicle-Studio-${VERSION}-macos-universal.dmg"

      - name: package Linux assets
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          APPIMAGE_PATH="$(find src-tauri/target -path '*/release/bundle/appimage/*.AppImage' -print -quit)"
          DEB_PATH="$(find src-tauri/target -path '*/release/bundle/deb/*.deb' -print -quit)"
          test -n "$APPIMAGE_PATH"
          test -n "$DEB_PATH"
          cp "$APPIMAGE_PATH" "RWR-Vehicle-Studio-${VERSION}-linux-x64.AppImage"
          cp "$DEB_PATH" "RWR-Vehicle-Studio-${VERSION}-linux-x64.deb"

      - name: upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: RWR-Vehicle-Studio-*
          if-no-files-found: error

  finalize-release:
    name: Upload formal release assets
    runs-on: ubuntu-latest
    needs: build-tauri
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: upload assets to existing GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG"
          mapfile -t assets < <(find release-artifacts -type f -print | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
