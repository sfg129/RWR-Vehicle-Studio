name: publish

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: nightly-publish
  cancel-in-progress: true

jobs:
  check-head:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    env:
      HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check current main head
        id: check
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"

          if [ "$HEAD_SHA" = "$CURRENT_MAIN" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale CI result: $HEAD_SHA; current main is $CURRENT_MAIN"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  build-tauri:
    name: Build ${{ matrix.platform }}
    needs: check-head
    runs-on: ${{ matrix.platform }}
    if: >-
      needs.check-head.outputs.should_publish == 'true'
      &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        ||
        (
          github.event_name == 'workflow_run'
          &&
          github.event.workflow_run.conclusion == 'success'
          &&
          github.event.workflow_run.head_branch == 'main'
        )
      )
    env:
      HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: build Tauri bundles
        uses: tauri-apps/tauri-action@v1.0.0
        with:
          args: ${{ matrix.args }}

      - name: package macOS app bundle
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.args }}" in
            *aarch64*) LABEL="arm64" ;;
            *x86_64*) LABEL="x64" ;;
            *universal*) LABEL="universal" ;;
            *) LABEL="macos" ;;
          esac

          APP_PATH="$(find src-tauri/target -path '*/release/bundle/macos/*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found" >&2
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "RWR-Vehicle-Studio-macos-${LABEL}.app.zip"

      - name: upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            RWR-Vehicle-Studio-macos-*.app.zip
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

  finalize-release:
    name: Publish nightly release
    runs-on: ubuntu-latest
    needs: build-tauri
    permissions:
      contents: write
    env:
      HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: retarget nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "$HEAD_SHA"
          git push -f origin refs/tags/nightly

      - name: download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: publish rolling nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-artifacts -type f -print | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

          mapfile -t asset_names < <(
            for asset in "${assets[@]}"; do
              basename "$asset"
            done
          )

          duplicates="$(printf '%s\n' "${asset_names[@]}" | sort | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "Duplicate release asset names:" >&2
            echo "$duplicates" >&2
            exit 1
          fi

          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly "${assets[@]}" --clobber
          else
            gh release create nightly "${assets[@]}" \
              --prerelease \
              --title "RWR Vehicle Studio (nightly)" \
              --notes "Rolling build from the latest successful CI commit on main."
          fi
