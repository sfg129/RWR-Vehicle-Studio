name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Builds the app with tauri-action on every commit to main and publishes a
# rolling "nightly" GitHub release. A fixed tag is force-pushed and the release
# is refreshed (not keyed by version tags). See https://v2.tauri.app/distribute/pipelines/github/
jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: nightly
          releaseName: 'RWR Vehicle Studio (nightly)'
          releaseBody: 'Rolling build from the latest commit on main. Assets are rebuilt and replaced on every push.'
          releaseDraft: false
          prerelease: true
